[package]
name = "quit"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["bevy_winit", "debug", "default_font", "x11", "ui_bevy_render"] }
db = { path = "../db" }
inc = { path = "../inc" }
tokio = { version = "1.51.1", features = ["rt-multi-thread"] }
diesel = { version = "2.3.7", features = ["postgres"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
dotenvy = "0.15"
